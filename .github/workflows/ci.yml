name: ci

on:
  push:
    branches: [main, feat/**]
  pull_request:

jobs:
  build-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Update dependencies
        run: |
          moon version --all
          moon update

      - name: Build
        # The module root is a library; type-check the whole module (and its
        # packages) with `moon check`. `moon test` links and runs the tests.
        run: moon check

      - name: Run unit + mock-broker tests
        run: moon test

      - name: Formatting check
        run: |
          if ! moon fmt --check; then
            echo "::error::run 'moon fmt'" && exit 1
          fi

      - name: .mbti clean-diff check
        run: |
          moon info
          git diff --exit-code -- '*.pkg.generated.mbti' \
            || { echo "::error::package interfaces (.mbti) changed unexpectedly; run 'moon info' and review the diff"; git diff -- '*.pkg.generated.mbti'; exit 1; }

  integration:
    name: Integration (Docker Kafka 4.3)
    runs-on: ubuntu-latest
    services:
      kafka:
        image: apache/kafka:4.3.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
          --health-interval 5s --health-retries 40 --health-start-period 30s
    env:
      KAFKA_BOOTSTRAP: localhost:9092
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          moon update

      - name: Run the mock-broker (fake broker) suite
        run: moon test --filter 'fake*' || moon test -p buf

      - name: Run real-cluster smoke test
        run: ./test/integration.sh

  golden:
    name: Golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit & cramjam
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          pip install cramjam
      - name: Regenerate golden files and diff (deterministic, fmt twice)
        run: |
          python3 test/golden/generate.py
          moon fmt
          moon fmt
          git diff --exit-code -- test/golden/ golden_test_data_test.mbt \
            || { echo "::error::golden fixtures changed; commit the regenerated bytes (make generate-golden)"; exit 1; }